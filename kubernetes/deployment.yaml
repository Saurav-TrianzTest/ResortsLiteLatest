apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortsLite
  namespace: resortsLite
  labels:
    app: resortsLite
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortsLite
  template:
    metadata:
      labels:
        app: resortsLite
        version: "1.0.0"
    spec:
      containers:
        - name: resortsLite
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"
            - name: TZ
              value: "UTC"
            # PostgreSQL datasource
            - name: SPRING_DATASOURCE_URL
              value: "{{SPRING_DATASOURCE_URL}}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{SPRING_DATASOURCE_USERNAME}}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "{{SPRING_DATASOURCE_PASSWORD}}"
            # Redis / ElastiCache
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: CACHE_TTL_MINUTES
              value: "{{CACHE_TTL_MINUTES}}"
            # Internal service endpoints
            - name: APP_PAYMENT_ENDPOINT
              value: "{{APP_PAYMENT_ENDPOINT}}"
            - name: APP_INVENTORY_ENDPOINT
              value: "{{APP_INVENTORY_ENDPOINT}}"
            - name: APP_NOTIFICATION_ENDPOINT
              value: "{{APP_NOTIFICATION_ENDPOINT}}"
            # Report storage
            - name: REPORT_BASE_PATH
              value: "{{REPORT_BASE_PATH}}"
            # JVM options
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/./urandom"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: reports-storage
              mountPath: /var/reports
      volumes:
        - name: reports-storage
          emptyDir: {}
      terminationGracePeriodSeconds: 30
