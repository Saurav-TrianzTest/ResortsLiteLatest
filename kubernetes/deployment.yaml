apiVersion: apps/v1
kind: Deployment
metadata:
  name: resortslite
  namespace: resortslite
  labels:
    app: resortslite
    app.kubernetes.io/name: resortslite
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resortslite
  template:
    metadata:
      labels:
        app: resortslite
        app.kubernetes.io/name: resortslite
    spec:
      # Run as non-root for security
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

      containers:
        - name: resortslite
          image: "{{IMAGE_URI}}"
          imagePullPolicy: Always

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          env:
            # Spring profile
            - name: SPRING_PROFILES_ACTIVE
              value: "docker"

            # PostgreSQL datasource
            - name: SPRING_DATASOURCE_URL
              value: "{{SPRING_DATASOURCE_URL}}"
            - name: SPRING_DATASOURCE_USERNAME
              value: "{{SPRING_DATASOURCE_USERNAME}}"
            - name: SPRING_DATASOURCE_PASSWORD
              value: "{{SPRING_DATASOURCE_PASSWORD}}"

            # Redis – Spring Session + Cache
            - name: REDIS_HOST
              value: "{{REDIS_HOST}}"
            - name: REDIS_PORT
              value: "{{REDIS_PORT}}"
            - name: REDIS_PASSWORD
              value: "{{REDIS_PASSWORD}}"
            - name: REDIS_SSL
              value: "{{REDIS_SSL}}"

            # Internal service endpoints
            - name: PAYMENT_API_URL
              value: "{{PAYMENT_API_URL}}"
            - name: APP_PAYMENT_ENDPOINT
              value: "{{APP_PAYMENT_ENDPOINT}}"
            - name: APP_INVENTORY_ENDPOINT
              value: "{{APP_INVENTORY_ENDPOINT}}"
            - name: APP_NOTIFICATION_ENDPOINT
              value: "{{APP_NOTIFICATION_ENDPOINT}}"

            # Report storage path
            - name: REPORT_BASE_PATH
              value: "{{REPORT_BASE_PATH}}"

            # JVM options
            - name: JAVA_OPTS
              value: >-
                -XX:+UseContainerSupport
                -XX:MaxRAMPercentage=75.0
                -XX:+UnlockExperimentalVMOptions
                -Xms256m
                -Xmx512m
                -Dfile.encoding=UTF-8
                -Duser.timezone=UTC

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"

          # Liveness probe – restart pod if app is unresponsive
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 90
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3

          # Readiness probe – remove pod from service if not ready
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3

          volumeMounts:
            - name: reports-storage
              mountPath: /app/reports

      volumes:
        - name: reports-storage
          emptyDir: {}

      terminationGracePeriodSeconds: 60
