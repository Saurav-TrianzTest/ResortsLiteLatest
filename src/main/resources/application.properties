# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Server port is resolved at runtime from AWS Systems Manager Parameter Store.
# The SSM parameter name is configured via SERVER_PORT_SSM_PARAM (default: /resortslite/server/port).
# In ECS/EKS/Elastic Beanstalk, set SERVER_PORT_SSM_PARAM to the environment-specific SSM path.
# The server.port property below acts as a local-development fallback only — it is NOT used
# when SSM is reachable, ensuring dynamic port assignment in cloud environments.
server.port=${SERVER_PORT:8080}

# cr-java-0090 FIX: Amazon Cognito User Pool configuration.
# COGNITO_USER_POOL_ID must be set in the ECS task definition, EKS pod spec, or
# Elastic Beanstalk environment properties pointing to the application's Cognito User Pool.
# Authentication credentials and user identity data are managed centrally by Cognito —
# no user data is stored in or read from local files, enabling horizontal scaling and
# providing encrypted, auditable authentication across all cloud deployment instances.
COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:}
AWS_REGION=${AWS_REGION:us-east-1}

# AWS SSM parameter name that holds the server port for this deployment environment.
# Override via the SERVER_PORT_SSM_PARAM environment variable in ECS task definitions,
# EKS pod specs, or Elastic Beanstalk environment properties.
SERVER_PORT_SSM_PARAM=/resortslite/server/port

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0065 FIX: Spring Session Data Redis — Amazon ElastiCache connection properties.
# REDIS_HOST and REDIS_PORT are resolved from environment variables at runtime.
# In AWS deployments, set these in the ECS task definition, EKS pod spec, or
# Elastic Beanstalk environment properties pointing to the ElastiCache cluster endpoint.
# Local development fallback: localhost:6379 (set via RedisSessionConfig bean).
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Spring Session store type — delegates HttpSession to Redis (ElastiCache)
spring.session.store-type=redis
# Session timeout (30 minutes); adjust per application security policy
spring.session.timeout=1800

# cr-java-0067 FIX: Booking cache TTL for Amazon ElastiCache for Redis.
# Controls how long individual booking entries are retained in the shared Redis cache
# before automatic expiration. Prevents unbounded memory growth and stale data across
# horizontally-scaled instances. Override via BOOKING_CACHE_TTL_MINUTES environment
# variable in the ECS task definition, EKS pod spec, or Elastic Beanstalk environment.
BOOKING_CACHE_TTL_MINUTES=${BOOKING_CACHE_TTL_MINUTES:30}
