# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0065 FIX: Azure Cache for Redis — externalises HTTP session state so all
# application instances share the same distributed store. Enables stateless horizontal
# scaling and eliminates server affinity requirements.
# Set AZURE_REDIS_HOST and AZURE_REDIS_PASSWORD as Azure App Service application settings
# or environment variables at deployment time.
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
spring.redis.timeout=2000ms
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortsLite:session
spring.session.timeout=30m

# cr-java-0077 FIX: Hard-coded port replaced with environment variable SERVER_PORT.
# Azure App Configuration / Azure App Service application settings supply SERVER_PORT at runtime,
# enabling dynamic port assignment by Azure container orchestration platforms.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://${DB_HOST:db-prod.resorts-internal.com}:${DB_PORT:5432}/${DB_NAME:orcl}
spring.datasource.username=${DB_USERNAME:admin}
spring.datasource.password=${DB_PASSWORD:Resort$Pass#2019!}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL) — replaces Oracle12cDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Azure Blob Storage configuration (replaces hard-coded file paths cr-java-0061)
# Set AZURE_STORAGE_CONNECTION_STRING as an environment variable or Azure App Service setting
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=your-account;AccountKey=your-key;EndpointSuffix=core.windows.net}
azure.storage.reports-container=resort-reports
azure.storage.backup-container=resort-backups

# cr-java-0071 FIX: Hard-coded environment URLs externalised to Azure App Configuration.
# Override these properties via Azure App Configuration service, Azure App Service application
# settings, or environment variables (INVENTORY_SERVICE_URL / REPORTS_DOWNLOAD_BASE_URL)
# to achieve environment-agnostic deployments without code changes.
app.inventory.service.url=${INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
app.reports.download.base-url=${REPORTS_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}

# =============================================================================
# cr-java-0090 FIX: Azure Active Directory (Entra ID) — Spring Security OAuth2
# Resource Server configuration.
#
# Replaces file-based authentication (static credential files / hardcoded user
# stores) with centralized Azure AD identity management.  Spring Security
# validates every inbound JWT against the Azure AD JWKS endpoint; no local
# credential file or in-memory user store is required.
#
# Required Azure AD values (set as Azure App Service application settings or
# environment variables — never hard-code in this file):
#   AZURE_AD_TENANT_ID  — Azure AD tenant GUID
#   AZURE_AD_CLIENT_ID  — App registration client / application ID
# =============================================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:your-tenant-id}/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:your-tenant-id}/discovery/v2.0/keys

# Azure AD audience claim — must match the App Registration's Application ID URI
spring.security.oauth2.resourceserver.jwt.audiences=${AZURE_AD_CLIENT_ID:your-client-id}

# Azure Key Vault URI for runtime secret retrieval (db-username, db-password)
azure.keyvault.uri=${AZURE_KEY_VAULT_URI:https://your-keyvault.vault.azure.net/}

# =============================================================================
# cr-java-0111 FIX: Azure Service Bus — distributed scheduled message delivery.
#
# Replaces java.util.Timer and server-local scheduling with Azure Service Bus
# scheduled messages for timezone-agnostic, distributed task execution across
# all cloud instances and regions.
#
# Required values (set as Azure App Service application settings or environment
# variables — never hard-code in this file):
#   AZURE_SERVICE_BUS_CONNECTION_STRING — Service Bus namespace connection string
# =============================================================================
azure.servicebus.connection-string=${AZURE_SERVICE_BUS_CONNECTION_STRING:}
azure.servicebus.report-queue-name=${AZURE_SERVICE_BUS_REPORT_QUEUE:resort-report-tasks}
