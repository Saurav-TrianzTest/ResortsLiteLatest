# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Port is now externalised — set the SERVER_PORT environment variable in Azure
# Container Apps / AKS to override at runtime. The application reads server.port which itself
# falls back to the SERVER_PORT env var, then defaults to 8080 if neither is set.
# In Azure Container Apps set: --env-vars SERVER_PORT=<dynamic-port>
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# Azure Blob Storage configuration — replaces hard-coded file-system paths (cr-java-0061)
# Set AZURE_STORAGE_CONNECTION_STRING environment variable in cloud deployment
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=changeme;AccountKey=changeme;EndpointSuffix=core.windows.net}
# Container names can be overridden via environment variables
azure.storage.reports-container=${AZURE_STORAGE_REPORTS_CONTAINER:reports}
azure.storage.backup-container=${AZURE_STORAGE_BACKUP_CONTAINER:resort-backups}

# cr-java-0071: Externalized environment-specific URLs — loaded from Azure App Configuration.
# Override these keys in Azure App Configuration or via environment variables per deployment environment.
# Inventory service URL — replaces hard-coded "http://inventory-service.internal:8081/rooms/available"
# in BookingController.java (line 66). Set APP_INVENTORY_SERVICE_URL env var in cloud deployment.
app.inventory.service.url=${APP_INVENTORY_SERVICE_URL:http://inventory-service.internal:8081/rooms/available}
# Report download base URL — replaces hard-coded "http://reports.resorts-internal.com:8080/download/"
# in ReportService.java (line 66). Set APP_REPORTS_DOWNLOAD_BASE_URL env var in cloud deployment.
app.reports.download.base-url=${APP_REPORTS_DOWNLOAD_BASE_URL:http://reports.resorts-internal.com:8080/download/}

# cr-java-0065 FIX: Azure Cache for Redis — externalised session state storage.
# Replaces in-memory HttpSession with a shared Redis store so that every application
# instance can read/write session data, enabling stateless horizontal scaling and
# failover without server affinity.
# Set AZURE_REDIS_HOST and AZURE_REDIS_PASSWORD environment variables in Azure
# Container Apps / AKS to point at your Azure Cache for Redis instance.
spring.redis.host=${AZURE_REDIS_HOST:localhost}
spring.redis.port=${AZURE_REDIS_PORT:6380}
spring.redis.password=${AZURE_REDIS_PASSWORD:}
spring.redis.ssl=${AZURE_REDIS_SSL:true}
# Spring Session: use Redis as the session store and set a 30-minute timeout.
spring.session.store-type=redis
spring.session.redis.namespace=resortslite:session
spring.session.timeout=1800

# =============================================================================
# cr-java-0090 FIX: Azure Active Directory (Entra ID) Authentication Configuration
# Replaces file-based credential/token storage with centralized Azure AD identity.
#
# The application is registered as an OAuth2 Resource Server in Azure AD.
# All API requests must carry a valid Azure AD JWT bearer token in the
# Authorization header. Tokens are validated against the tenant's JWKS endpoint.
#
# Set the following environment variables in Azure Container Apps / AKS:
#   AZURE_AD_TENANT_ID     — Azure AD tenant (directory) ID
#   AZURE_AD_CLIENT_ID     — App registration (client) ID
#   AZURE_AD_CLIENT_SECRET — App registration client secret (store in Key Vault)
# =============================================================================

# Azure AD tenant and app registration identifiers
spring.cloud.azure.active-directory.enabled=true
spring.cloud.azure.active-directory.credential.client-id=${AZURE_AD_CLIENT_ID:}
spring.cloud.azure.active-directory.credential.client-secret=${AZURE_AD_CLIENT_SECRET:}
spring.cloud.azure.active-directory.profile.tenant-id=${AZURE_AD_TENANT_ID:}

# Configure the application as an OAuth2 Resource Server (validates incoming JWT tokens)
spring.cloud.azure.active-directory.application-type=resource-server

# JWT issuer URI — derived from tenant ID; Spring Security uses this to fetch JWKS keys
# and validate the 'iss' claim on every inbound bearer token.
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:common}/v2.0

# =============================================================================
# cr-java-0111 FIX: Azure Service Bus Configuration for Scheduled Message Delivery
# Replaces java.util.Timer / server-local scheduling with Azure Service Bus
# scheduled messages for distributed, timezone-agnostic task execution.
#
# Set the following environment variables in Azure Container Apps / AKS:
#   AZURE_SERVICEBUS_CONNECTION_STRING — Azure Service Bus namespace connection string
#                                        (store in Azure Key Vault, inject via secret ref)
#   AZURE_SERVICEBUS_REPORT_QUEUE      — Queue name for report generation tasks
#                                        (defaults to 'report-tasks' if not set)
# =============================================================================
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.report-queue=${AZURE_SERVICEBUS_REPORT_QUEUE:report-tasks}
