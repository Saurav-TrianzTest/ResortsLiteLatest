# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/orcl
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0063 FIX: Amazon ElastiCache (Redis) connection for Spring Session Data Redis.
# Session data is stored in Redis so all EKS pods share session state without sticky sessions.
# Set REDIS_HOST to the ElastiCache primary endpoint and REDIS_PORT to the cluster port.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# health-check-endpoint: Expose /actuator/health for EKS liveness and readiness probes.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# cz-java-0070 FIX: Amazon ElastiCache (Redis) distributed cache TTL.
# Set CACHE_TTL_MINUTES to control how long booking entries are cached in Redis.
# RedisCacheConfig reads this env var; default is 30 minutes if not set.
# Inject via Kubernetes ConfigMap: CACHE_TTL_MINUTES=<value>
