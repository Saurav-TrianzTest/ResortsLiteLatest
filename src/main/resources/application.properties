# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
# cr-java-0077: Hard-coded port replaced with environment variable.
# GCP Cloud Run automatically injects the PORT environment variable.
# For GKE / local dev, set SERVER_PORT env var or override via -Dserver.port=<port>.
server.port=${PORT:${SERVER_PORT:8080}}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# cr-java-0069 [GCP Cloud Readiness / CRITICAL]: Hard-coded database credentials replaced with
# Google Secret Manager integration via Spring Cloud GCP Secret Manager (sm:// URI scheme).
# Secrets 'db-host', 'db-username', and 'db-password' must be created in GCP Secret Manager
# before deployment. The sm:// prefix instructs Spring Cloud GCP to resolve values at runtime,
# enabling credential rotation without redeployment and preventing exposure in version control.
spring.datasource.host=${sm://db-host}
spring.datasource.url=jdbc:oracle:thin:@${sm://db-host}:1521:ORCL
spring.datasource.username=${sm://db-username}
spring.datasource.password=${sm://db-password}
# Enable Spring Cloud GCP Secret Manager bootstrap
spring.cloud.gcp.secretmanager.enabled=true
# GCP project ID — set via GCP_PROJECT_ID environment variable or Workload Identity
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071: Externalized environment-specific URLs (Hard-coded Environment URLs fix).
# Override these values per environment via GCP Cloud Run environment variables or
# GCP Secret Manager (sm:// URI scheme) to avoid hard-coded URLs in source code.
# Inventory service URL used by BookingController — override with INVENTORY_SERVICE_URL env var
app.inventory.url=${INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}
# Report download base URL used by ReportService — override with REPORT_DOWNLOAD_BASE_URL env var
app.report.download.base-url=${REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download}

# Google Cloud Storage configuration (cr-java-0062)
# Override via environment variables: GCS_REPORT_BUCKET, GCS_REPORT_PREFIX, GCS_BACKUP_PREFIX
gcs.report.bucket=${GCS_REPORT_BUCKET:resort-reports-bucket}
gcs.report.prefix=${GCS_REPORT_PREFIX:reports/}
gcs.backup.prefix=${GCS_BACKUP_PREFIX:backups/nightly/}

# cr-java-0065: GCP Memorystore for Redis — centralized session storage replacing HttpSession.
# Set REDIS_HOST to the Memorystore instance IP (e.g., 10.0.0.3) and REDIS_PORT (default 6379).
# Spring Session automatically serialises session attributes to Redis, enabling stateless
# horizontal scaling across all Cloud Run / GKE instances without server affinity.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
# Use Redis as the Spring Session store
spring.session.store-type=redis
# Session timeout — 30 minutes default, override with SESSION_TIMEOUT_SECONDS env var
spring.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}s
spring.session.redis.namespace=resortslite:session
