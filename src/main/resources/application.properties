# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# =============================================================================
# cr-java-0065 FIX: Spring Session Data Redis — Amazon ElastiCache for Redis
# =============================================================================
# Instructs Spring Boot to use Redis as the HTTP session store instead of the
# default JVM-local in-memory store. Spring Session's SessionRepositoryFilter
# intercepts every HttpSession read/write and transparently delegates to the
# configured Amazon ElastiCache for Redis cluster, enabling stateless application
# instances that can be safely load-balanced and auto-scaled.
#
# AWS ElastiCache for Redis connection — supply these via environment variables
# (ECS task definition / EKS pod spec / Elastic Beanstalk environment properties)
# or via AWS Systems Manager Parameter Store:
#   SPRING_REDIS_HOST  → primary endpoint of the ElastiCache Redis cluster
#                        e.g. resortslite-session.xxxxxx.ng.0001.use1.cache.amazonaws.com
#   SPRING_REDIS_PORT  → Redis port (default 6379; use 6380 for TLS)
#   SPRING_REDIS_SSL   → true when using in-transit encryption (recommended for prod)
#   SPRING_REDIS_PASSWORD → AUTH token if ElastiCache auth is enabled
#
# Session TTL: sessions expire after 30 minutes of inactivity (configurable via
# SPRING_SESSION_TIMEOUT, expressed as a Duration string, e.g. "30m").
spring.session.store-type=redis
spring.session.timeout=${SPRING_SESSION_TIMEOUT:30m}
spring.session.redis.namespace=resortslite:session
spring.session.redis.flush-mode=on-save

# Redis connection (Amazon ElastiCache primary endpoint)
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.ssl=${SPRING_REDIS_SSL:false}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
# =============================================================================

# =============================================================================
# cr-java-0067 FIX: Amazon ElastiCache for Redis — Booking Cache TTL
# =============================================================================
# Replaces the unbounded static in-memory HashMap (bookingCache) in BookingController
# with a Redis-backed cache that enforces an explicit TTL on every entry.
#
# app.booking.cache.ttl-minutes controls how long a cached booking entry lives in
# Amazon ElastiCache for Redis before it is automatically evicted. This prevents
# indefinite memory growth, eliminates stale data, and ensures all application
# instances in the Auto Scaling Group share a consistent, up-to-date cache.
#
# Override via the APP_BOOKING_CACHE_TTL_MINUTES environment variable or inject
# from AWS Systems Manager Parameter Store:
#   /resortslite/{env}/booking/cache/ttl-minutes  →  30
# =============================================================================
app.booking.cache.ttl-minutes=${APP_BOOKING_CACHE_TTL_MINUTES:30}
# =============================================================================


# cr-java-0077 FIX: Server port externalised to AWS Systems Manager Parameter Store.
# The hard-coded value 8080 has been replaced with an environment-variable reference so that
# ECS task definitions, EKS pod specs, and Elastic Beanstalk environment properties can inject
# the correct port at runtime without any code change.
#
# AWS SSM Parameter Store recommended path:
#   /resortslite/{env}/server/port  →  8080  (or the port assigned by the orchestrator)
# Inject as environment variable SERVER_PORT in the ECS task definition / EKS pod spec, e.g.:
#   environment:
#     - name: SERVER_PORT
#       value: "8080"
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
# cr-java-0069 FIX: Credentials removed from properties file.
# At runtime BookingService.loadCredentialsFromSecretsManager() fetches username/password
# from AWS Secrets Manager (secret name = ${AWS_DB_SECRET_NAME}).
# The datasource bootstrap values below fall back to environment variables so that
# Spring's connection pool can also be initialised without hard-coded secrets.
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASS:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# AWS Secrets Manager configuration (cr-java-0069)
# Set AWS_DB_SECRET_NAME to the Secrets Manager secret that holds DB credentials, e.g.:
#   AWS_DB_SECRET_NAME=resortslite/db/credentials
# The secret value must be a JSON object: {"username":"...","password":"..."}
# Set AWS_REGION to the region where the secret is stored (default: us-east-1).
AWS_DB_SECRET_NAME=${AWS_DB_SECRET_NAME:resortslite/db/credentials}
AWS_REGION=${AWS_REGION:us-east-1}

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0061 FIX: Amazon S3 configuration replaces hard-coded local file-system paths.
# Override these via environment variables (AWS_S3_REPORTS_BUCKET, AWS_S3_BACKUP_PREFIX,
# AWS_S3_REPORTS_PREFIX, AWS_REGION) or inject from AWS Parameter Store / Secrets Manager.
app.s3.region=${AWS_REGION:us-east-1}
app.s3.reports.bucket=${AWS_S3_REPORTS_BUCKET:resort-reports-bucket}
app.s3.reports.prefix=${AWS_S3_REPORTS_PREFIX:reports/}
app.s3.backup.prefix=${AWS_S3_BACKUP_PREFIX:backups/nightly/}

# cr-java-0071 FIX: Externalized environment-specific URLs via AWS Systems Manager Parameter Store.
# These properties replace the following hardcoded URLs found in the source code:
#   BookingController.java line 66: "http://inventory-service.internal:8081/rooms/available"
#   ReportService.java line 66:     "http://reports.resorts-internal.com:8080/download/"
#
# In AWS deployments, populate the corresponding SSM Parameter Store entries, e.g.:
#   /resortslite/{env}/inventory/url              -> https://inventory-service.internal:8081/rooms/available
#   /resortslite/{env}/report/download-base-url   -> https://reports.resorts-internal.com/download/
# and inject them as environment variables (APP_INVENTORY_URL, APP_REPORT_DOWNLOAD_BASE_URL)
# or via Spring Cloud AWS SSM property source integration.
app.inventory.url=${APP_INVENTORY_URL:https://inventory-service.internal:8081/rooms/available}
app.report.download.base-url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# =============================================================================
# cr-java-0090 FIX: Amazon Cognito — User Identity Management
# =============================================================================
# Replaces file-based authentication with Amazon Cognito User Pools.
# Authentication credentials and user data are no longer stored in or read from
# local files. All user identity operations are delegated to Cognito.
#
# Supply these via environment variables (ECS task definition / EKS pod spec /
# Elastic Beanstalk environment properties) or AWS Systems Manager Parameter Store:
#
#   AWS_COGNITO_USER_POOL_ID   — Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   AWS_COGNITO_CLIENT_ID      — App client ID registered in the User Pool
#   AWS_COGNITO_SECRET_NAME    — Secrets Manager secret holding the app-client secret
#                                JSON format: {"clientSecret":"<value>"}
#
# The Cognito app-client secret is fetched from AWS Secrets Manager at startup
# (see BookingService.loadCredentialsFromSecretsManager) so it is never stored
# in source code, container images, or configuration files.
# =============================================================================
aws.cognito.user-pool-id=${AWS_COGNITO_USER_POOL_ID:}
aws.cognito.client-id=${AWS_COGNITO_CLIENT_ID:}
aws.cognito.secret-name=${AWS_COGNITO_SECRET_NAME:resortslite/cognito/clientSecret}
