# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 Configuration for Report Storage
# Replace hard-coded file paths with S3 object storage
aws.s3.bucket.name=${AWS_S3_BUCKET_NAME:resortslite-reports}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.reports.prefix=reports/
aws.s3.backups.prefix=backups/nightly/

# AWS Secrets Manager Configuration
# FIXED cr-java-0069: Database credentials retrieved from AWS Secrets Manager
# Secret should contain JSON with keys: dbHost, dbUser, dbPassword, paymentApiUrl
# Example secret format: {"dbHost":"db-prod.resorts.com","dbUser":"admin","dbPassword":"xxx","paymentApiUrl":"https://payment-api.resorts.com"}
aws.secretsmanager.secret.name=${AWS_SECRETS_MANAGER_SECRET_NAME:resortslite/database/credentials}
aws.region=${AWS_REGION:us-east-1}

# AWS Systems Manager Parameter Store Configuration
# FIXED cr-java-0071: Environment-specific URLs externalized to Parameter Store
# Parameter Store parameters should be created with the following names:
#   - /resortslite/inventory-service-url (e.g., https://inventory-service.prod.internal:8081/rooms/available)
#   - /resortslite/report-download-base-url (e.g., https://reports.resorts-prod.com)
# These parameters enable environment-agnostic deployments without code changes.
# The application will fall back to default values if parameters are not found.
aws.parameterstore.prefix=${AWS_PARAMETER_STORE_PREFIX:/resortslite}

# Default values for local development (overridden by Parameter Store in cloud environments)
# These are used as fallbacks when Parameter Store parameters are not available
# In production, ensure Parameter Store parameters are configured for all environment-specific URLs

# Spring Session Configuration - Amazon ElastiCache for Redis
# FIXED cr-java-0065: HTTP session state migrated to Amazon ElastiCache for Redis
# Enables stateless application instances with centralized, distributed session management
spring.session.store-type=redis
spring.session.redis.namespace=spring:session
spring.session.timeout=1800s

# Redis Configuration for AWS ElastiCache
# In production, set REDIS_HOST to your ElastiCache cluster endpoint
# Example: resortslite-session.abc123.ng.0001.use1.cache.amazonaws.com
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=2000ms

# Redis Cache Configuration for Amazon ElastiCache
# FIXED cr-java-0067: Configured Redis cache with TTL policies for booking data
spring.cache.type=redis
spring.cache.redis.time-to-live=1800000
spring.cache.redis.cache-null-values=false
spring.cache.redis.use-key-prefix=true

# AWS Cognito Configuration for User Authentication
# FIXED cr-java-0090: Integrated Amazon Cognito for cloud-native user identity management
# Replaces file-based authentication with centralized, encrypted, and auditable authentication
# Configure these values in AWS Systems Manager Parameter Store or as environment variables
aws.cognito.userPoolId=${AWS_COGNITO_USER_POOL_ID:}
aws.cognito.clientId=${AWS_COGNITO_CLIENT_ID:}
aws.cognito.region=${AWS_REGION:us-east-1}

# Confirmation code salt stored in AWS Secrets Manager
# Secret key: confirmationCodeSalt
aws.secretsmanager.confirmation.salt.key=confirmationCodeSalt
