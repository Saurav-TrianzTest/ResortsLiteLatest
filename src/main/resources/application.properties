# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment variable injection.
# The SERVER_PORT environment variable is set at runtime by ECS task definitions,
# EKS pod specs, or Elastic Beanstalk environment configuration, enabling dynamic
# port assignment required by container orchestration and AWS service discovery.
# Falls back to 8080 for local development when SERVER_PORT is not set.
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------------------
# Amazon Cognito Configuration (cr-java-0090 fix — replaces file-based authentication)
# User identity management is delegated to Amazon Cognito User Pools.
# User attributes (email, name, roles) are retrieved directly from Cognito,
# replacing any file-based user store or locally-stored authentication data.
#
# Required environment variables for cloud deployments:
#   COGNITO_USER_POOL_ID — the Cognito User Pool ID that manages resort guest identities
#                          (e.g. us-east-1_AbCdEfGhI)
# -----------------------------------------------------------------------
app.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}

# cr-java-0069 FIX: Hard-coded DB credentials removed from source code and properties file.
# The datasource URL still references the host via an environment variable so the hostname
# is no longer baked into the artifact.  Username and password are retrieved at runtime
# from AWS Secrets Manager (see SecretsManagerConfig + BookingService.getDbCredential).
# Set DB_SECRET_NAME to the Secrets Manager secret that holds {"username":"...","password":"..."}.
spring.datasource.url=jdbc:postgresql://${DB_HOST:db-prod.resorts-internal.com}:${DB_PORT:5432}/${DB_NAME:resortsdb}
spring.datasource.username=${DB_USERNAME:#{null}}
spring.datasource.password=${DB_PASSWORD:#{null}}
spring.datasource.driver-class-name=org.postgresql.Driver

# AWS Secrets Manager secret name that stores DB credentials (cr-java-0069)
# Override via environment variable: DB_SECRET_NAME=<your-secret-name>
app.db.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# -----------------------------------------------------------------------
# AWS S3 Configuration (cr-java-0061 fix — replaces hard-coded file paths)
# Override these values via environment variables in cloud deployments:
#   REPORTS_S3_BUCKET  — name of the S3 bucket for reports
#   REPORTS_S3_PREFIX  — S3 key prefix for monthly reports (default: reports/)
#   BACKUP_S3_PREFIX   — S3 key prefix for nightly backups (default: backups/nightly/)
#   AWS_REGION         — AWS region where the S3 bucket resides (default: us-east-1)
# -----------------------------------------------------------------------
cloud.aws.s3.bucket-name=${REPORTS_S3_BUCKET:resort-reports}
cloud.aws.s3.reports-prefix=${REPORTS_S3_PREFIX:reports/}
cloud.aws.s3.backup-prefix=${BACKUP_S3_PREFIX:backups/nightly/}
cloud.aws.region.static=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# AWS SSM Parameter Store Configuration (cr-java-0071 fix — replaces hard-coded environment URLs)
# These properties define the SSM parameter NAMES (paths) used to look up
# environment-specific URLs at runtime. Each deployment environment (dev, staging,
# production) stores its own URL value in SSM under the same parameter name,
# enabling environment-agnostic deployments with no code changes between environments.
#
# Override parameter names via environment variables:
#   SSM_PARAM_INVENTORY_URL       — SSM path for inventory service URL
#                                   (default: /resortslite/inventory/service-url)
#   SSM_PARAM_REPORT_DOWNLOAD_URL — SSM path for report download base URL
#                                   (default: /resortslite/reports/download-base-url)
# -----------------------------------------------------------------------
app.ssm.param.inventory-url=${SSM_PARAM_INVENTORY_URL:/resortslite/inventory/service-url}
app.ssm.param.report-download-url=${SSM_PARAM_REPORT_DOWNLOAD_URL:/resortslite/reports/download-base-url}

# -----------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session with Amazon ElastiCache for Redis
# Replaces HttpSession (server-affinity) with distributed session storage.
# All session attributes are stored in Redis so any application instance
# can serve any request — enabling stateless horizontal scaling on AWS.
#
# Required environment variables for cloud deployments:
#   REDIS_HOST     — ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   REDIS_PORT     — Redis port (default: 6379)
#   REDIS_PASSWORD — Auth token if ElastiCache in-transit encryption / AUTH is enabled
#                    (leave unset or empty for clusters without AUTH)
#   SESSION_TIMEOUT_SECONDS — session TTL in seconds (default: 1800 = 30 minutes)
# -----------------------------------------------------------------------
# Spring Session store type — delegates to Redis via spring-session-data-redis
spring.session.store-type=redis
# Session timeout (TTL in Redis); override via SESSION_TIMEOUT_SECONDS env var
spring.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}
# Redis connection — points to Amazon ElastiCache primary endpoint
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
# Use SSL/TLS when connecting to ElastiCache with in-transit encryption enabled
spring.redis.ssl=${REDIS_SSL:false}

# -----------------------------------------------------------------------
# cr-java-0067 FIX: Amazon ElastiCache for Redis — Booking Cache TTL
# Replaces the former unbounded static in-memory HashMap (bookingCache) with
# a Redis-backed cache entry stored under "booking:<bookingId>" with an
# explicit TTL.  This prevents indefinite memory growth, stale data, and
# instance-local cache visibility that breaks horizontal scaling on AWS.
#
# Required / optional environment variables:
#   BOOKING_CACHE_TTL_SECONDS — TTL (in seconds) for each booking cache entry.
#                               Defaults to 1800 (30 minutes).
#                               Set to a lower value for high-churn workloads.
# -----------------------------------------------------------------------
app.cache.booking-ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:1800}
