# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0065 FIX: Spring Session Data Redis — HTTP session state is stored in
# Amazon ElastiCache for Redis instead of the local JVM heap.  All application
# instances share the same session store, so AWS ALB can route any request to
# any instance without sticky sessions, and session data survives instance
# termination or auto-scaling events.
#
# Required environment variables (set in ECS task definition / Elastic
# Beanstalk environment / EC2 user-data):
#   REDIS_HOST — ElastiCache primary endpoint hostname  (default: localhost)
#   REDIS_PORT — ElastiCache port                       (default: 6379)
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.session.timeout=1800

# cr-java-0067 FIX: Booking cache TTL configuration for Amazon ElastiCache for Redis.
# The unbounded static HashMap (in-memory cache without TTL) has been replaced with
# Spring Data Redis RedisTemplate backed by Amazon ElastiCache for Redis.
# Each booking cache entry is stored with a configurable TTL to prevent indefinite
# memory growth, stale data inconsistencies, and instance-local caching issues.
#
# Required environment variable (set in ECS task definition / Elastic Beanstalk
# environment / EC2 user-data):
#   BOOKING_CACHE_TTL_SECS — TTL in seconds for each booking cache entry
#                            (default: 1800 = 30 minutes)
booking.cache.ttl.seconds=${BOOKING_CACHE_TTL_SECS:1800}

# Amazon S3 configuration — replaces hard-coded local file paths (cr-java-0061)
# Override cloud.aws.s3.bucket-name via environment variable or AWS Parameter Store
cloud.aws.s3.bucket-name=${S3_BUCKET_NAME:resortslite-reports}
cloud.aws.s3.backup-prefix=${S3_BACKUP_PREFIX:backups/nightly/}
aws.region=${AWS_REGION:us-east-1}

# cr-java-0077 FIX: Hard-coded port 8080 replaced with SERVER_PORT environment variable.
# ECS task definitions, EKS pod specs, and Elastic Beanstalk environment properties
# should set SERVER_PORT to the desired port at deploy time, enabling dynamic port
# assignment required by container orchestration and cloud service discovery.
# Falls back to 8080 for local development when SERVER_PORT is not set.
server.port=${SERVER_PORT:8080}

# cr-java-0069 FIX: Hard-coded database credentials removed.
# DB hostname is externalised to the DB_HOST environment variable.
# DB username and password are NO LONGER stored here; they are retrieved at runtime
# from AWS Secrets Manager using the secret name in DB_SECRET_NAME.
# Set the following environment variables before deployment:
#   DB_HOST          - database hostname (e.g. db-prod.resorts-internal.com)
#   DB_SECRET_NAME   - AWS Secrets Manager secret name (e.g. resortslite/db/credentials)
#                      Secret must contain JSON: {"username":"...","password":"..."}
#   AWS_REGION       - AWS region where the secret is stored (e.g. us-east-1)
spring.datasource.url=jdbc:oracle:thin:@${DB_HOST:db-prod.resorts-internal.com}:1521:ORCL
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# AWS Secrets Manager configuration for database credentials (cr-java-0069)
# The secret name below must match the secret created in AWS Secrets Manager.
app.db.host=${DB_HOST:db-prod.resorts-internal.com}
app.db.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 FIX: Hard-coded environment URLs replaced with AWS Systems Manager Parameter Store.
# The following environment variables control which SSM parameter names are resolved at runtime.
# Create the corresponding parameters in AWS SSM Parameter Store before deployment:
#   /resortslite/inventory/service-url  -> e.g. https://inventory-service.internal:8081/rooms/available
#   /resortslite/reports/base-url       -> e.g. https://reports.resorts-internal.com/download/
# Set the following environment variables to override the default SSM parameter names:
#   SSM_PARAM_INVENTORY_URL   - SSM parameter name for the inventory service URL
#                               (default: /resortslite/inventory/service-url)
#   SSM_PARAM_REPORT_BASE_URL - SSM parameter name for the report download base URL
#                               (default: /resortslite/reports/base-url)

# =============================================================================
# cr-java-0090 FIX: Amazon Cognito configuration — replaces file-based authentication
# =============================================================================
# Authentication credentials and user identity data are no longer stored in local
# files, hard-coded constants, or source-code strings.  Amazon Cognito User Pools
# provide centralised, encrypted, and auditable user identity management with
# built-in lifecycle management (sign-up, sign-in, MFA, password policies, account
# recovery).  The Cognito app-client secret is stored in AWS Secrets Manager and
# retrieved at runtime — it is never committed to version control.
#
# Required environment variables (set in ECS task definition / Elastic Beanstalk
# environment / EC2 user-data):
#   COGNITO_USER_POOL_ID       — Cognito User Pool ID  (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_CLIENT_ID          — Cognito App Client ID
#   COGNITO_CLIENT_SECRET_NAME — AWS Secrets Manager secret name that holds the
#                                Cognito app-client secret JSON:
#                                {"clientSecret":"<value>"}
#                                (default: resortslite/cognito/client-secret)
#   AWS_REGION                 — AWS region (e.g. us-east-1)
app.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
app.cognito.client-id=${COGNITO_CLIENT_ID:}
app.cognito.client-secret-name=${COGNITO_CLIENT_SECRET_NAME:resortslite/cognito/client-secret}
