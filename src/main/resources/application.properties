# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port replaced with environment variable for Azure App Configuration.
# Set the SERVER_PORT environment variable in Azure App Service / Container Apps to allow
# dynamic port assignment by the container orchestration platform.
# Azure App Configuration key: server.port
# Environment variable: SERVER_PORT
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521:ORCL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# JPA-Hibernate properties (Oracle) — same pattern as FirstAppOracle Doctor entity
spring.jpa.database-platform=org.hibernate.dialect.Oracle12cDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cr-java-0071 FIX: Externalized environment-specific URLs for Azure App Configuration.
# Set APP_INVENTORY_URL to override the inventory service endpoint per environment.
# In Azure App Configuration, create key: app.inventory.url
app.inventory.url=${APP_INVENTORY_URL:${app.inventory.endpoint:http://inventory-service.internal:8081}}/rooms/available

# cr-java-0071 FIX: Externalized report download base URL for Azure App Configuration.
# Set APP_REPORTS_DOWNLOAD_BASE_URL to override the reports download endpoint per environment.
# In Azure App Configuration, create key: app.reports.download-base-url
# When not set, the Azure Blob Storage URL is used as the canonical download endpoint.
app.reports.download-base-url=${APP_REPORTS_DOWNLOAD_BASE_URL:}

# Azure Blob Storage configuration — replaces hard-coded file paths (cr-java-0061)
# Set AZURE_STORAGE_CONNECTION_STRING environment variable in Azure App Service / Container Apps
azure.storage.connection-string=${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=https;AccountName=changeme;AccountKey=changeme;EndpointSuffix=core.windows.net}
# Container names for reports and backups (replaces /var/legacy/reports/ and C:\ResortBackups\nightly\)
azure.storage.reports.container-name=${AZURE_STORAGE_REPORTS_CONTAINER:reports}
azure.storage.backup.container-name=${AZURE_STORAGE_BACKUP_CONTAINER:backups}

# =============================================================================
# cr-java-0111 FIX: Azure Service Bus — distributed, timezone-agnostic scheduling
# Replaces server-local java.util.Timer and SimpleDateFormat/new Date() timezone
# dependencies with Azure Service Bus scheduled message delivery.
#
# Configuration:
#   AZURE_SERVICEBUS_CONNECTION_STRING — Azure Service Bus namespace connection string
#     (from Azure Portal > Service Bus Namespace > Shared Access Policies)
#   AZURE_SERVICEBUS_QUEUE_NAME        — Name of the queue for report generation tasks
#
# Scheduled messages are enqueued with an explicit UTC OffsetDateTime, ensuring
# timezone-agnostic delivery across all cloud regions and container instances.
# =============================================================================
azure.servicebus.connection-string=${AZURE_SERVICEBUS_CONNECTION_STRING:}
azure.servicebus.queue-name=${AZURE_SERVICEBUS_QUEUE_NAME:report-tasks}

# Azure Key Vault configuration — cr-java-0069: replaces hard-coded DB credentials in BookingService
# Set AZURE_KEYVAULT_URI to your Key Vault endpoint, e.g. https://<vault-name>.vault.azure.net/
# Authentication uses DefaultAzureCredential (Managed Identity in Azure, env vars locally)
azure.keyvault.uri=${AZURE_KEYVAULT_URI}
# Names of the secrets stored in Key Vault (defaults match recommended naming convention)
azure.keyvault.secret.db-host=${AZURE_KEYVAULT_SECRET_DB_HOST:db-host-secret}
azure.keyvault.secret.db-user=${AZURE_KEYVAULT_SECRET_DB_USER:db-user-secret}
azure.keyvault.secret.db-pass=${AZURE_KEYVAULT_SECRET_DB_PASS:db-pass-secret}

# =============================================================================
# cr-java-0065 FIX: Azure Cache for Redis — distributed session state storage
# Replaces in-process HttpSession to enable stateless horizontal scaling.
# Set REDIS_HOST, REDIS_PORT, and REDIS_PASSWORD environment variables in
# Azure App Service / Container Apps, or configure via Azure App Configuration.
# Azure Cache for Redis connection details:
#   Host:     <your-cache-name>.redis.cache.windows.net
#   Port:     6380 (SSL) or 6379 (non-SSL)
#   Password: primary or secondary access key from Azure Portal
# =============================================================================
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
spring.redis.timeout=${REDIS_TIMEOUT_MS:2000}

# Spring Session — use Redis as the session store (cr-java-0065)
spring.session.store-type=redis
spring.session.redis.namespace=resortsLite:session

# Session TTL in minutes — configurable per environment (cr-java-0065)
app.session.ttl-minutes=${SESSION_TTL_MINUTES:30}

# =============================================================================
# cr-java-0067 FIX: Azure Cache for Redis — distributed booking cache with TTL
# Replaces the in-memory bookingCache HashMap (no TTL) in BookingController.
# Set CACHE_TTL_MINUTES to control how long booking entries are cached in Redis.
# Defaults to 60 minutes. Prevents indefinite memory growth and stale data across
# multiple application instances in a horizontally scaled Azure deployment.
# =============================================================================
app.cache.ttl-minutes=${CACHE_TTL_MINUTES:60}

# =============================================================================
# cr-java-0090 FIX: Azure Active Directory (Entra ID) — OAuth2 Resource Server
# Replaces file-based authentication credential storage with centralized Azure AD
# identity management using Spring Security OAuth2 / OIDC JWT Bearer tokens.
#
# Configuration:
#   AZURE_AD_TENANT_ID   — Azure AD tenant ID (GUID), set in App Service / Container Apps
#   AZURE_AD_CLIENT_ID   — Application (client) ID registered in Azure AD App Registration
#
# How it works:
#   1. Clients obtain a JWT Bearer token from Azure AD using OAuth2 authorization flows.
#   2. Spring Security validates the token signature against Azure AD's JWKS endpoint.
#   3. The validated JWT principal (OID claim) is available via SecurityContextHolder.
#   4. BookingService.getAzureAdConfirmationToken() uses the OID as the confirmation token,
#      eliminating local file-based credential storage and MD5 hashing entirely.
#
# Azure AD JWKS URI format:
#   https://login.microsoftonline.com/{tenant-id}/discovery/v2.0/keys
# Issuer URI format:
#   https://login.microsoftonline.com/{tenant-id}/v2.0
# =============================================================================
azure.activedirectory.tenant-id=${AZURE_AD_TENANT_ID:common}
azure.activedirectory.client-id=${AZURE_AD_CLIENT_ID:}

# Spring Security OAuth2 Resource Server — JWT issuer URI for Azure AD token validation
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:common}/v2.0
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://login.microsoftonline.com/${AZURE_AD_TENANT_ID:common}/discovery/v2.0/keys
