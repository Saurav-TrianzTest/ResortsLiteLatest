# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# -----------------------------------------------------------------------
# cr-java-0090 FIX: Amazon Cognito User Pool – replaces file-based authentication.
# User identity and authentication credentials are no longer stored in local files.
# All authentication is delegated to Amazon Cognito User Pool, which provides
# centralized, encrypted, and auditable identity management with built-in user
# lifecycle management, MFA, and horizontal scalability.
#
# In cloud deployments, set these environment variables at runtime:
#   COGNITO_USER_POOL_ID  – the Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_APP_CLIENT_ID – the Cognito App Client ID configured for this application
# These can be sourced from AWS Systems Manager Parameter Store and injected via
# ECS task definition / EKS pod spec / Elastic Beanstalk environment properties.
# -----------------------------------------------------------------------
aws.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
aws.cognito.app-client-id=${COGNITO_APP_CLIENT_ID:}

# cr-java-0077 FIX: Hard-coded port 8080 replaced with environment variable injection.
# In AWS ECS/EKS/Elastic Beanstalk, set the SERVER_PORT environment variable at runtime
# (e.g., via ECS task definition environment, EKS pod spec env, or EB environment properties).
# The value can also be sourced from AWS Systems Manager Parameter Store
# (SSM param: /resortslite/server/port) and injected as SERVER_PORT at deployment time.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 configuration – replaces hard-coded file paths (cr-java-0061)
# Set aws.s3.reports.bucket via environment variable AWS_S3_REPORTS_BUCKET in cloud deployments
aws.s3.reports.bucket=${AWS_S3_REPORTS_BUCKET:resorts-lite-reports}

# AWS Secrets Manager configuration – replaces hard-coded DB credentials (cr-java-0069)
# Set DB_SECRET_NAME env var to the name/ARN of the secret in AWS Secrets Manager.
# The secret must be a JSON object: {"username":"<db-user>","password":"<db-pass>"}
# Example: DB_SECRET_NAME=resortslite/db/credentials
aws.secretsmanager.db.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}

# S3 key prefix for monthly reports (default: reports/)
aws.s3.reports.prefix=${AWS_S3_REPORTS_PREFIX:reports/}
# S3 key prefix for nightly backups – replaces hard-coded C:\ResortBackups\nightly\ (cr-java-0061)
aws.s3.backup.prefix=${AWS_S3_BACKUP_PREFIX:backups/nightly/}
# AWS region for S3 client
aws.region=${AWS_REGION:us-east-1}

# -----------------------------------------------------------------------
# cr-java-0071 FIX: Hard-coded Environment URLs externalised via
# AWS Systems Manager Parameter Store.
# In cloud deployments, set these environment variables to the values
# retrieved from the corresponding SSM parameters:
#   SSM param: /resortslite/inventory/service/url  → env: APP_INVENTORY_SERVICE_URL
#   SSM param: /resortslite/report/download/base-url → env: APP_REPORT_DOWNLOAD_BASE_URL
# -----------------------------------------------------------------------

# Inventory service URL (replaces hard-coded http://inventory-service.internal:8081/rooms/available)
app.inventory.service.url=${APP_INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}

# Report download base URL (replaces hard-coded http://reports.resorts-internal.com:8080/download/)
app.report.download.base.url=${APP_REPORT_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# -----------------------------------------------------------------------
# cr-java-0065 FIX: Amazon ElastiCache for Redis – Spring Session configuration.
# Spring Session Data Redis replaces the in-process HttpSession with a distributed,
# Redis-backed session store. All session state is stored in the shared ElastiCache
# cluster so every EC2 instance in the Auto Scaling Group can serve any request
# without sticky sessions, enabling safe horizontal scaling and instance replacement.
#
# In cloud deployments, set these environment variables at runtime:
#   REDIS_HOST  – ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   REDIS_PORT  – ElastiCache port (default: 6379)
#   REDIS_SESSION_TTL_SECONDS – session time-to-live in seconds (default: 1800 = 30 min)
# These can be sourced from AWS Systems Manager Parameter Store and injected as
# environment variables via ECS task definition / EKS pod spec / Elastic Beanstalk
# environment properties.
# -----------------------------------------------------------------------
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
# Session time-to-live: 30 minutes by default; override via REDIS_SESSION_TTL_SECONDS env var
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
server.servlet.session.timeout=${REDIS_SESSION_TTL_SECONDS:1800}s

# -----------------------------------------------------------------------
# cr-java-0067 FIX: Amazon ElastiCache for Redis – booking cache TTL configuration.
# Replaces the unbounded static in-memory HashMap (bookingCache) with a Redis-backed
# cache entry that expires automatically. Each booking is stored under the key prefix
# "booking:cache:<bookingId>" with a TTL of BOOKING_CACHE_TTL_SECONDS seconds.
# This prevents indefinite memory growth, stale data across instances, and ensures
# consistent cache state across all EC2 instances in the Auto Scaling Group.
#
# Override via the BOOKING_CACHE_TTL_SECONDS environment variable at deployment time.
# -----------------------------------------------------------------------
booking.cache.ttl.seconds=${BOOKING_CACHE_TTL_SECONDS:1800}
