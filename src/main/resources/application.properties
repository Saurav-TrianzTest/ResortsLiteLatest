# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0077 FIX: Hard-coded port replaced with environment variable injection.
# In AWS ECS/EKS/Elastic Beanstalk, set the SERVER_PORT environment variable in the task definition,
# pod spec, or environment configuration. The AWS Systems Manager Parameter Store parameter
# /resortslite/server/port can be mapped to the SERVER_PORT env var at deployment time.
# Falls back to 8080 if SERVER_PORT is not set (local development).
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# AWS S3 configuration — replaces hardcoded local file paths (cr-java-0061)
# Set these via environment variables in cloud deployment:
#   CLOUD_AWS_S3_BUCKET_NAME, CLOUD_AWS_S3_REPORT_PREFIX, CLOUD_AWS_S3_BACKUP_PREFIX
#   AWS_REGION, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (or use IAM role)
cloud.aws.s3.bucket-name=${CLOUD_AWS_S3_BUCKET_NAME:resorts-lite-reports}
cloud.aws.s3.report-prefix=${CLOUD_AWS_S3_REPORT_PREFIX:reports/}
cloud.aws.s3.backup-prefix=${CLOUD_AWS_S3_BACKUP_PREFIX:backups/nightly/}
cloud.aws.region=${AWS_REGION:us-east-1}

# cr-java-0069 FIX: Database credentials are no longer hard-coded in source code.
# They are retrieved at runtime from AWS Secrets Manager using the secret name below.
# Set DB_SECRET_NAME to the ARN or friendly name of the secret in AWS Secrets Manager.
# The secret must be a JSON object: {"username":"<user>","password":"<pass>"}
# The runtime IAM role/task role must have secretsmanager:GetSecretValue on this secret.
app.db.secret-name=${DB_SECRET_NAME:resortslite/db/credentials}
app.db.host=${DB_HOST:db-prod.resorts-internal.com}

# ---------------------------------------------------------------------------
# cr-java-0090 FIX: Amazon Cognito User Pool — replaces file-based authentication
# ---------------------------------------------------------------------------
# Authentication credentials and user identity data are no longer stored in local
# files or derived from broken hash algorithms (MD5). Amazon Cognito User Pools
# provide centralised, encrypted, and auditable user lifecycle management.
#
# Required environment variables for AWS deployment:
#   COGNITO_USER_POOL_ID  — The Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_APP_CLIENT_ID — The Cognito App Client ID associated with the User Pool
#
# The runtime IAM role/task role must have the following permission:
#   cognito-idp:AdminGetUser on the configured User Pool ARN
#
# Leave blank in local/test environments — the application will fall back to
# generating a secure random confirmation token without Cognito identity lookup.
app.cognito.user-pool-id=${COGNITO_USER_POOL_ID:}
app.cognito.app-client-id=${COGNITO_APP_CLIENT_ID:}

# cr-java-0071 FIX: Environment-specific service URLs externalized via AWS SSM Parameter Store.
# These properties replace hard-coded URLs in BookingController (line 66) and ReportService (line 66).
# In AWS deployments, set the corresponding environment variables or configure the SSM parameters:
#
#   SSM Parameter: /resortslite/inventory/service-url
#   Env Variable:  APP_INVENTORY_SERVICE_URL
#   Used by:       BookingController.inventoryServiceUrl (@Value: app.inventory.service-url)
app.inventory.service-url=${APP_INVENTORY_SERVICE_URL:https://inventory-service.internal:8081/rooms/available}

#   SSM Parameter: /resortslite/reports/download-base-url
#   Env Variable:  APP_REPORTS_DOWNLOAD_BASE_URL
#   Used by:       ReportService.reportDownloadBaseUrl (@Value: app.reports.download-base-url)
app.reports.download-base-url=${APP_REPORTS_DOWNLOAD_BASE_URL:https://reports.resorts-internal.com/download/}

# ---------------------------------------------------------------------------
# cr-java-0065 FIX: Spring Session Data Redis — Amazon ElastiCache for Redis
# ---------------------------------------------------------------------------
# Spring Session Data Redis replaces the in-process HttpSession store with a
# centralised Redis store backed by Amazon ElastiCache.  All session data is
# shared across every application instance, enabling stateless horizontal
# scaling behind the AWS ALB without sticky sessions.
#
# Required AWS ElastiCache / Redis connection settings:
#   REDIS_HOST  — ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com)
#   REDIS_PORT  — Redis port (default 6379)
#   REDIS_PASSWORD — Auth token if in-transit encryption / AUTH is enabled on the cluster
#
# Session TTL (seconds): default 1800 (30 minutes). Override with SESSION_TIMEOUT_SECONDS.
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=resortslite:session
server.servlet.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}s

# ---------------------------------------------------------------------------
# cr-java-0067 FIX: Amazon ElastiCache for Redis — Booking Cache TTL
# ---------------------------------------------------------------------------
# The static in-memory HashMap (bookingCache) in BookingController has been replaced
# with a centralised Redis cache backed by Amazon ElastiCache. Entries are stored with
# an explicit TTL to prevent unbounded memory growth and stale data across instances.
#
# Required environment variable for AWS deployment:
#   BOOKING_CACHE_TTL_SECONDS — TTL in seconds for booking cache entries (default: 3600 = 1 hour)
#
# Redis key prefix: booking:cache:<bookingId>
app.cache.booking.ttl-seconds=${BOOKING_CACHE_TTL_SECONDS:3600}
