# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# VIOLATION czr-port-001 [Software Portability]: Fixed port prevents dynamic assignment by ECS/EKS
server.port=8080

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:postgresql://db-prod.resorts-internal.com:5432/orcl
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA-Hibernate properties (PostgreSQL)
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send

# cz-java-0063 — Spring Session backed by Azure Cache for Redis
# Redis connection credentials are injected at runtime from Azure Key Vault
# via the Secrets Store CSI Driver as Kubernetes environment variables.
# AKS pod spec must mount the Key Vault secret as env vars:
#   SPRING_REDIS_HOST     -> Azure Cache for Redis hostname
#   SPRING_REDIS_PORT     -> Redis TLS port (6380 for Azure Cache for Redis)
#   SPRING_REDIS_PASSWORD -> Redis primary access key (from Key Vault secret)
#   SPRING_REDIS_SSL      -> true (Azure Cache for Redis enforces TLS)
spring.redis.host=${SPRING_REDIS_HOST:localhost}
spring.redis.port=${SPRING_REDIS_PORT:6380}
spring.redis.password=${SPRING_REDIS_PASSWORD:}
spring.redis.ssl=${SPRING_REDIS_SSL:true}
# Spring Session store type — delegates HttpSession to Redis
spring.session.store-type=redis
spring.session.redis.flush-mode=on-save
spring.session.redis.namespace=spring:session:resortslite

# cz-java-0070 — Azure Cache for Redis booking cache TTL
# Controls how long booking entries live in the Redis cache before automatic eviction.
# Externalised via environment variable BOOKING_CACHE_TTL_SECONDS (default: 3600s / 1 hour).
# Inject via Kubernetes ConfigMap or Azure App Configuration for environment-specific tuning.
BOOKING_CACHE_TTL_SECONDS=${BOOKING_CACHE_TTL_SECONDS:3600}

# Health check endpoint configuration (health-check-endpoint)
# Exposes /actuator/health for container liveness/readiness probes
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator
