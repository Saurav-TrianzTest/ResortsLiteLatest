# ResortsLite - Java 25 / Spring Boot 3.3 Configuration
# FIXED: JAVA8_TO_25_SPRING_BOOT_BASELINE — configuration aligned with Spring Boot 3.3 / Java 25
spring.application.name=ResortsLite

# NOTE: Fixed port prevents dynamic assignment by container orchestrators (ECS/EKS).
# Consider removing or externalising for cloud deployments.
server.port=8080

# NOTE: Hardcoded DB hostname and credentials should be externalised to
# environment variables or AWS Parameter Store / Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:oracle:thin:@db-prod.resorts-internal.com:1521:ORCL
spring.datasource.username=admin
spring.datasource.password=Resort$Pass#2019!
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# FIXED: JAVA8_TO_25_JAKARTA_NAMESPACE_MIGRATION — updated Hibernate dialect from
# Oracle12cDialect (removed in Hibernate 6 / Spring Boot 3) to OracleDialect which
# is the correct dialect for Hibernate 6.x used by Spring Boot 3.3.
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

# NOTE: Internal service endpoints should be externalised to configuration
# for cloud VPC environments with proper DNS / service discovery.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
