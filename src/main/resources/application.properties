# ResortsLite - Legacy Configuration
# VIOLATION cr-java-0021: Hardcoded infrastructure values in properties file
spring.application.name=ResortsLite

# cr-java-0065 fix: Spring Session with Amazon ElastiCache for Redis.
# All HttpSession attributes are now stored in the shared Redis cluster, making
# every application instance fully stateless and enabling horizontal scaling.
# Set REDIS_HOST and REDIS_PORT via environment variables in your ECS task definition,
# EKS pod spec, or Elastic Beanstalk environment configuration.
# REDIS_HOST should point to the ElastiCache primary endpoint (e.g. my-cluster.abc123.ng.0001.use1.cache.amazonaws.com).
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}
spring.redis.ssl=${REDIS_SSL:false}
# Spring Session store type — must be 'redis' to activate ElastiCache-backed sessions.
spring.session.store-type=redis
# Session timeout (default 30 minutes). Override via SESSION_TIMEOUT_SECONDS env var.
spring.session.timeout=${SESSION_TIMEOUT_SECONDS:1800}
# Redis namespace for Spring Session keys (avoids collisions with other apps on the same cluster).
spring.session.redis.namespace=resortslite:session
# Flush mode: ON_SAVE persists session changes at the end of each request (recommended for ElastiCache).
spring.session.redis.flush-mode=on_save

# cr-java-0067 fix: Booking cache TTL configuration for Amazon ElastiCache for Redis.
# Replaces the former unbounded in-memory HashMap (bookingCache) with a Redis-backed
# distributed cache. Each booking entry is stored with an explicit TTL to prevent
# indefinite memory growth and ensure stale data is automatically evicted.
# Override via the BOOKING_CACHE_TTL_MINUTES environment variable in your ECS task
# definition, EKS pod spec, or Elastic Beanstalk environment configuration.
app.cache.booking-ttl-minutes=${BOOKING_CACHE_TTL_MINUTES:30}

# cr-java-0061 fix: Amazon S3 configuration replacing hard-coded file paths.
# Override these values via environment variables REPORT_S3_BUCKET, BACKUP_S3_PREFIX, and AWS_REGION
# in your ECS task definition / EKS pod spec / Lambda environment.
cloud.aws.s3.report-bucket=${REPORT_S3_BUCKET:resorts-lite-reports}
cloud.aws.s3.backup-prefix=${BACKUP_S3_PREFIX:backups/nightly/}
cloud.aws.region.static=${AWS_REGION:us-east-1}

# cr-java-0071 fix: AWS Systems Manager Parameter Store parameter names for environment-specific URLs.
# These replace hard-coded environment URLs in BookingController.java (line 66) and
# ReportService.java (line 66).  Set the SSM parameter values per environment in AWS SSM:
#
#   /resortslite/inventory/url          → e.g. https://inventory-service.internal:8081/rooms/available
#   /resortslite/reports/download-base-url → e.g. https://reports.resorts-prod.example.com/download/
#
# Override the parameter NAMES via environment variables if needed:
app.ssm.inventory-url-param=${INVENTORY_URL_PARAM_NAME:/resortslite/inventory/url}
app.ssm.report-url-param=${REPORT_URL_PARAM_NAME:/resortslite/reports/download-base-url}

# AWS credentials are supplied by the IAM role attached to the compute resource (no hard-coded keys).


# cr-java-0077 fix: Hard-coded port 8080 replaced with environment variable injection.
# The SERVER_PORT environment variable is injected at runtime by ECS task definition,
# EKS pod spec, or Elastic Beanstalk environment configuration.
# AWS Systems Manager Parameter Store can be used to manage the port value per environment.
# Default falls back to 8080 only for local development if SERVER_PORT is not set.
server.port=${SERVER_PORT:8080}

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded DB hostname and credentials.
# Must be externalised to AWS Parameter Store or Secrets Manager for cloud deployment.
spring.datasource.url=jdbc:h2:mem:resortdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# cr-java-0069 FIX: Hard-coded DB_USER ("admin") and DB_PASS ("Resort$Pass#2019!") have been
# removed from BookingService.java. Database credentials are now retrieved at runtime from
# AWS Secrets Manager. Set the following environment variables in your ECS task definition,
# EKS pod spec, or Lambda environment configuration:
#
#   DB_SECRET_NAME  - Name/ARN of the Secrets Manager secret (default: resortslite/db/credentials)
#                     Secret must be a JSON object: {"username": "...", "password": "..."}
#   AWS_REGION      - AWS region where the secret is stored (default: us-east-1)
DB_SECRET_NAME=${DB_SECRET_NAME:resortslite/db/credentials}

spring.h2.console.enabled=true

# cr-java-0090 FIX: Amazon Cognito User Pool configuration for cloud-native user identity management.
# Replaces file-based authentication (hardcoded credentials / local credential files) with
# Amazon Cognito, which provides centralized, encrypted, and auditable authentication with
# built-in user lifecycle management (sign-up, sign-in, MFA, password policies).
#
# Set the following environment variables in your ECS task definition, EKS pod spec,
# or Lambda environment configuration:
#
#   COGNITO_USER_POOL_ID  - The Cognito User Pool ID (e.g. us-east-1_AbCdEfGhI)
#   COGNITO_CLIENT_ID     - The Cognito App Client ID for the application
#   AWS_REGION            - AWS region where the Cognito User Pool is hosted (default: us-east-1)
COGNITO_USER_POOL_ID=${COGNITO_USER_POOL_ID:}
COGNITO_CLIENT_ID=${COGNITO_CLIENT_ID:}

spring.h2.console.path=/h2-console

# VIOLATION cr-java-0021 [Cloud Compatibility / Mandatory]: Hardcoded internal service endpoints.
# These hostnames are non-routable in cloud VPC environments without manual DNS configuration.
app.payment.endpoint=http://payment-svc.internal:9090/charge
app.inventory.endpoint=http://inventory-svc.internal:8081/rooms
app.notification.endpoint=http://notify.internal:7070/send
