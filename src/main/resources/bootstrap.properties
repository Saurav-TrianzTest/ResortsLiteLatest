# cr-java-0069 [GCP Cloud Readiness / CRITICAL]: Bootstrap configuration for Spring Cloud GCP
# Secret Manager. This file is loaded before application.properties, enabling the sm:// URI
# scheme to resolve secrets (db-host, db-username, db-password) from Google Secret Manager
# at application startup — before any datasource beans are initialised.
#
# Required GCP secrets to create before deployment:
#   gcloud secrets create db-host     --replication-policy=automatic
#   gcloud secrets create db-username --replication-policy=automatic
#   gcloud secrets create db-password --replication-policy=automatic
#
# The service account / Workload Identity running this application must have the
# roles/secretmanager.secretAccessor IAM role on the above secrets.

spring.cloud.gcp.secretmanager.enabled=true
spring.cloud.gcp.project-id=${GCP_PROJECT_ID:}
