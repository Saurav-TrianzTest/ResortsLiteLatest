version: "3.8"

services:
  resortslite:
    image: resortslite:latest
    container_name: resortslite-app
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=UTC
      # Redis connection — provide actual values at runtime
      - SPRING_REDIS_HOST=${SPRING_REDIS_HOST:-localhost}
      - SPRING_REDIS_PORT=${SPRING_REDIS_PORT:-6380}
      - SPRING_REDIS_PASSWORD=${SPRING_REDIS_PASSWORD:-}
      - SPRING_REDIS_SSL=${SPRING_REDIS_SSL:-true}
      # Booking cache TTL
      - BOOKING_CACHE_TTL_SECONDS=${BOOKING_CACHE_TTL_SECONDS:-3600}
      # Database connection — provide actual values at runtime
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://localhost:5432/orcl}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-admin}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-}
      # Internal service endpoints
      - PAYMENT_API_URL=${PAYMENT_API_URL:-http://payment-service:9090/payments/charge}
      - REPORT_BASE_PATH=${REPORT_BASE_PATH:-/var/reports/}
      # JVM options
      - JAVA_OPTS=-Xmx512m -Xms256m -XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0
    volumes:
      - reports-data:/var/reports
    networks:
      - app-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  reports-data:
    driver: local

networks:
  app-network:
    driver: bridge
