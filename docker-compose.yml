version: "3.8"

services:
  resortslite:
    image: resortslite:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resortslite-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - TZ=UTC
      # Oracle Database connection (provide via .env or environment)
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:oracle:thin:@localhost:1521:ORCL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-admin}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-changeme}
      # Redis / ElastiCache connection
      - REDIS_HOST=${REDIS_HOST:-localhost}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      # Internal service endpoints
      - PAYMENT_API_URL=${PAYMENT_API_URL:-http://payment-service:9090/payments/charge}
      - APP_PAYMENT_ENDPOINT=${APP_PAYMENT_ENDPOINT:-http://payment-service:9090/charge}
      - APP_INVENTORY_ENDPOINT=${APP_INVENTORY_ENDPOINT:-http://inventory-service:8081/rooms}
      - APP_NOTIFICATION_ENDPOINT=${APP_NOTIFICATION_ENDPOINT:-http://notify-service:7070/send}
      # File paths (override via env for container mounts)
      - REPORT_BASE_PATH=${REPORT_BASE_PATH:-/var/reports}
      - BACKUP_PATH=${BACKUP_PATH:-/var/backups}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      # JVM options
      - JAVA_OPTS=-XX:+UseContainerSupport -XX:MaxRAMPercentage=75.0 -Xms256m -Xmx512m
    volumes:
      - reports-data:/var/reports
      - backups-data:/var/backups
    networks:
      - app-network
    restart: unless-stopped

volumes:
  reports-data:
  backups-data:

networks:
  app-network:
    driver: bridge
