# Test configuration - uses H2 in-memory database instead of Oracle
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=Oracle
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Disable Oracle-specific auto-configuration for tests
spring.autoconfigure.exclude=

# Application settings for tests
server.port=0
app.payment.endpoint=http://localhost:9090/charge
app.inventory.endpoint=http://localhost:8081/rooms
app.notification.endpoint=http://localhost:7070/send
